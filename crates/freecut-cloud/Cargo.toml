[package]
name = "freecut-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The real HTTPS transport (ureq, rustls, the platform's certificate roots).
# Without it the crate contains no networking code at all: the protocol,
# OAuth, catalogue and guard logic run against the in-memory fake server.
http = ["dep:ureq", "dep:rustls"]
# `provider::scripted::ScriptedProvider` for app and assistant tests (§6.1);
# enable it from dev-dependencies only.
test-support = []

[dependencies]
freecut-timeline.workspace = true
# `CancelToken` only. A path dependency, not `workspace = true`, so that
# FFmpeg stays off (the workspace entry keeps media's default features).
freecut-media = { path = "../freecut-media", default-features = false }

base64.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

ureq = { workspace = true, optional = true }
# ring as the crypto provider the transport hands to ureq, and certificate
# errors to classify as "not sent" (§4.5).
rustls = { workspace = true, features = ["ring"], optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true

[lints]
workspace = true
