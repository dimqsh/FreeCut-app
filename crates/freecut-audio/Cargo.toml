[package]
name = "freecut-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
freecut-media = { workspace = true, optional = true }
freecut-timeline.workspace = true

cpal = { workspace = true, optional = true }
crossbeam-channel.workspace = true
# Free space on the recording's disk (AU-027 stops a take at 50 MB free).
fs4.workspace = true
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["media", "output", "record"]
# Decoding sources needs FFmpeg; the mixer itself builds and tests without it.
media = ["dep:freecut-media"]
# Real-time playback on the system's default output device.
output = ["dep:cpal"]
# Microphone capture for voiceover recording (AU-027). The recorder itself
# (state machine, WAV writer, meters, synthetic sources) builds without it.
record = ["dep:cpal"]

[lints]
workspace = true
