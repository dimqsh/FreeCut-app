[package]
name = "freecut-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
freecut-timeline.workspace = true
serde.workspace = true
# `arbitrary_precision` keeps numbers in unknown keys exactly as written
# (an integer beyond 64 bits would otherwise come back as a rounded float),
# so they survive open -> save verbatim (PM-021). The DTOs only flatten
# `serde_json::Value` maps, which read such numbers back correctly.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
serde_path_to_error.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Host name for the lock file's holder metadata (PM-013). Apache-2.0.
gethostname = "1.1.0"

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
