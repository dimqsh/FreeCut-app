name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash everywhere: on Windows the default pwsh fails a multi-line step
    # only on its last command, which hid a clippy failure (review R8).
    # GitHub runs bash with -e -o pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux GUI and audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libasound2-dev libfontconfig1-dev libclang-dev pkg-config
      - name: Install pinned FFmpeg 8 development libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/freecut-ffmpeg.tar.xz"
          curl --fail --location --retry 3 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-14-13-03/ffmpeg-n8.1.3-18-g46d899d7a0-linux64-gpl-shared-8.1.tar.xz' --output "$archive"
          echo "cd7b846585e536e6f54dcec47743563d941dfdeef35e40aae86dec50d6cb8393  $archive" | sha256sum --check
          ffmpeg_root="$RUNNER_TEMP/freecut-ffmpeg"
          mkdir "$ffmpeg_root"
          tar -xJf "$archive" --strip-components=1 -C "$ffmpeg_root"
          sed -i "s|^prefix=.*|prefix=$ffmpeg_root|" "$ffmpeg_root"/lib/pkgconfig/*.pc
          echo "PKG_CONFIG_PATH=$ffmpeg_root/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ffmpeg_root/lib" >> "$GITHUB_ENV"
          echo "$ffmpeg_root/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg development libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          # ffmpeg-sys caches a versioned Cellar link path. Pass that physical
          # prefix as a Cargo input so Homebrew upgrades invalidate the build.
          ffmpeg_root="$(cd "$(brew --prefix ffmpeg)" && pwd -P)"
          echo "FFMPEG_DIR=$ffmpeg_root" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install pinned FFmpeg development libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup_windows_ffmpeg.ps1 -Destination "$env:RUNNER_TEMP/freecut-ffmpeg"
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Git Bash prepends its POSIX link.exe to PATH; select MSVC explicitly.
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path $linker)) { throw "Missing MSVC linker: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: 'true'
      # Dependency guards inspect other targets and optional cloud features
      # with --offline; fetch the complete lockfile before running them.
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Audio mixer builds without FFmpeg
        run: cargo test -p freecut-audio --no-default-features
      - name: Cloud lint (http and test-support features)
        run: cargo clippy -p freecut-cloud --all-targets --features http,test-support -- -D warnings
      # Without dev targets, as the app builds it: building tests or examples
      # turns on test-support through the crate's self dev-dependency, so this
      # is the only lint of the shipping configuration (review R41).
      - name: Cloud lint as shipped (no dev targets, no test-support)
        run: |
          cargo clippy -p freecut-cloud -- -D warnings
          cargo clippy -p freecut-cloud --features http -- -D warnings
      - name: Cloud transport tests (http feature; tests use 127.0.0.1 only)
        run: cargo test -p freecut-cloud --features http
